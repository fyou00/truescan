<!doctype html>
<html lang="id" data-type="software">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f6">
    <meta name="page-type" content="software">
    <meta name="site-kind" content="software">
    <meta name="description" content="Ambil halaman dengan kamera atau impor foto untuk melihat dokumen di perangkat Anda.">
    <title>Pindai dokumen · TrueScan</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="corners.js" defer></script>
    <script src="document.js" defer></script>
</head>
<body>
    <a class="skip" href="#scanner">Langsung ke pemindai</a>
    <header>
        <div class="wrap masthead">
            <span class="brand">
                <svg width="36" height="36" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M16 7H7V16 M32 7H41V16 M41 32V41H32 M16 41H7V32" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <g fill="#14b8a6"><rect x="15" y="19" width="18" height="3" rx="1.5"/><rect x="18" y="26" width="12" height="3" rx="1.5"/></g>
                </svg>
                TrueScan
            </span>
            <span class="local-note">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10" width="13" height="10" rx="2"/><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3"/></svg>
                Foto tetap di perangkat
            </span>
        </div>
    </header>

    <main class="wrap" id="scanner">
        <h1>Pindai dokumen</h1>
        <p class="intro">Ambil satu halaman dengan kamera atau pilih foto dari perangkat.</p>

        <section class="workspace" aria-labelledby="preview-heading">
            <div class="tools">
                <h2 id="preview-heading">Pratinjau halaman</h2>
                <div class="actions">
                    <button id="open-camera" type="button" class="button primary">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h3l1.6-2.8h6.8L17 7.5h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.1"/></svg>
                        Buka kamera
                    </button>
                    <input id="photo-file" class="file-input" type="file" accept="image/jpeg,image/png,image/webp">
                    <label id="import-photo" for="photo-file" class="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2"/><circle cx="8.2" cy="9.2" r="1.4"/><path d="m4.5 18 5-5 3 2.6 3.5-4 4.5 5"/></svg>
                        Impor foto
                    </label>
                    <button id="take-photo" type="button" class="button primary" hidden>Ambil foto</button>
                    <button id="stop-camera" type="button" class="button" hidden>Tutup kamera</button>
                </div>
            </div>
            <div class="preview">
                <div id="empty-preview">
                    <div class="viewfinder" aria-hidden="true">
                        <i></i><i></i><i></i><i></i>
                        <div class="sheet"><span class="ink-heading"></span><span></span><span></span><span></span></div>
                    </div>
                    <p>Belum ada halaman</p>
                </div>
                <video id="camera-preview" autoplay playsinline muted hidden aria-label="Pratinjau kamera"></video>
                <canvas id="page-preview" hidden aria-label="Pratinjau foto dokumen"></canvas>
                <div id="corner-overlay" hidden tabindex="0" role="group" aria-label="Empat sudut dokumen" aria-describedby="corner-message">
                    <svg aria-hidden="true" preserveAspectRatio="none">
                        <polyline id="corner-outline" vector-effect="non-scaling-stroke"/>
                    </svg>
                </div>
                <img id="corrected-preview" hidden alt="Pratinjau dokumen yang sudah diluruskan">
            </div>
            <div id="corner-tools" hidden>
                <div class="corner-help">
                    <h3 id="corner-heading">Sudut dokumen</h3>
                    <p id="corner-message" role="status"></p>
                </div>
                <div class="actions">
                    <button type="button" class="button" id="reset-corners">Pilih ulang</button>
                    <button type="button" class="button" id="detect-corners">Deteksi lagi</button>
                    <button type="button" class="button primary" id="apply-corners" disabled>Luruskan halaman</button>
                    <button type="button" class="button" id="edit-corners" hidden>Edit sudut</button>
                    <button type="button" class="button primary" id="add-page" hidden>Tambah ke dokumen</button>
                </div>
            </div>
            <div class="status-bar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v5m0-8v.1"/></svg>
                <p id="status" role="status" aria-live="polite">Siap mengambil halaman.</p>
            </div>
        </section>
        <section id="document-panel" class="workspace" hidden aria-labelledby="document-heading">
            <div class="tools">
                <div>
                    <h2 id="document-heading">Dokumen PDF</h2>
                    <p id="page-count"></p>
                </div>
                <div class="export-tools">
                    <label for="document-mode">Mode halaman</label>
                    <select id="document-mode">
                        <option value="color">Warna</option>
                        <option value="grayscale">Abu-abu</option>
                        <option value="black-and-white">Hitam-putih</option>
                    </select>
                    <button type="button" class="button primary" id="download-pdf" disabled>Unduh PDF</button>
                </div>
            </div>
            <ol id="document-pages" aria-label="Urutan halaman PDF"></ol>
            <div class="document-feedback">
                <p id="document-status" role="status"></p>
                <button class="button" id="retry-previews" type="button" hidden>Muat ulang pratinjau</button>
            </div>
        </section>
    </main>
</body>
</html>
